server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression: la dashboard carica bastante JS/CSS, gzip vale quasi sempre la pena
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # File con hash nel nome (vite li genera così): si possono cachingiare per sempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # L'app è una SPA: qualsiasi ruta sconosciuta deve riconsegnare index.html,
    # altrimenti un refresh su /qualcosa darebbe 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Il bundle non deve restare appiccicato al browser dopo un aggiornamento
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ------------------------------------------------------------------
    # OPZIONALE — proxy anti-CORS per il crawling dei singoli URL.
    # Oggi le GET di warming partono dal browser e vengono bloccate dal CORS
    # dei siti bersaglio. Srotolando questo blocco nginx fa da tramite:
    # il browser chiama /crawl?url=... e nginx inoltra la richiesta.
    # ATTENZIONE: trasforma il container in un proxy aperto. Da usare solo
    # su reti private, e restringendo il dominio target in proxy_pass.
    # ------------------------------------------------------------------
    # location /crawl {
    #     resolver 127.0.0.11 valid=30s ipv6=off;
    #     set $target "";
    #     proxy_pass $target;
    #     proxy_set_header User-Agent $http_x_warm_user_agent;
    # }
}
